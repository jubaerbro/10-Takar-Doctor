name: Build Android app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Android project files are generated here, not stored in the repository (yet).
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.tentakardoctor --project-name ten_takar_doctor .

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # A debug build for testing on your own phone. The signed Play Store build is a later step.
      # Set the repository variable API_BASE_URL to the address of the hosted backend.
      - name: Build test APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ten-takar-doctor-test-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
